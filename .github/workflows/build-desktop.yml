name: Build desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ClipperCuan-Windows
          - os: macos-14          # Apple Silicon
            name: ClipperCuan-macOS-AppleSilicon
          - os: macos-13          # Intel
            name: ClipperCuan-macOS-Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python tests/test_core.py

      - name: Build
        run: python build.py

      - name: Smoke test (CLI + server)
        shell: bash
        env:
          CLIPPER_HOME: ${{ runner.temp }}/clipper-home
        run: |
          set -e
          EXE=dist/ClipperCuan/ClipperCuan
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -hide_banner -loglevel error -y -f lavfi -i "testsrc2=s=1280x720:r=30:d=20" -f lavfi -i "sine=f=440:d=20" -shortest -c:v libx264 -c:a aac test.mp4
          "$EXE" cli test.mp4 --clips 1 --min 5 --max 10 --model tiny --emoji --json > result.json
          python - <<'PY'
          import json, os
          d = json.load(open("result.json"))
          assert d["status"] == "done", d
          v = d["clips"][0]["video_path"]
          assert v and os.path.getsize(v) > 10000, v
          print("CLI OK:", v)
          PY
          "$EXE" --no-browser --port 8799 > server.log 2>&1 &
          for i in $(seq 1 60); do sleep 2; curl -sf http://127.0.0.1:8799/api/info > /dev/null && break; done
          curl -sf http://127.0.0.1:8799/ | grep -q "ClipperCuan Studio"
          curl -sf http://127.0.0.1:8799/api/system | python -c "import sys,json; d=json.load(sys.stdin); assert d['ffmpeg']['libass'], d; print('SERVER OK', d['ffmpeg']['version'])"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item ..\README.md dist\ClipperCuan\BACA-SAYA.md
          Compress-Archive -Path dist\ClipperCuan -DestinationPath "${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cp ../README.md dist/ClipperCuan/BACA-SAYA.md
          ditto -c -k --sequesterRsrc --keepParent dist/ClipperCuan "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: app/${{ matrix.name }}.zip
          retention-days: 30
